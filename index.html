<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyAura 1000% Exact Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#07080f] text-zinc-100 font-sans h-full flex flex-col lg:flex-row overflow-hidden select-none">

    <!-- LEFT SECTION: Video Player & Control Bar -->
    <div class="flex-1 flex flex-col h-full bg-black relative min-h-0">
        
        <!-- Top Header Navigation Bar -->
        <div class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/90 via-black/40 to-transparent">
            <div class="flex items-center space-x-3 min-w-0">
                <button class="text-white text-lg hover:opacity-80">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 id="lectureTitle" class="text-xs sm:text-sm font-semibold text-zinc-100 truncate">
                    Quadratic Equation 11 : Common Root Condition || Lo...
                </h1>
            </div>
            <button class="text-white text-base hover:opacity-80">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
        </div>

        <!-- Video Screen Container -->
        <div class="relative flex-1 flex items-center justify-center bg-black overflow-hidden min-h-0">
            <video id="mainVideo" class="w-full h-full object-contain" controls poster="https://static.pw.live/5eb393ee95fab7468a79d189/ADMIN/4a144fcc-5b0e-44e0-b587-a840149cab1b.png">
                <source src="https://spark-url3.b-cdn.net/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4/mp4/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4_720p.mp4" type="video/mp4">
            </video>

            <!-- Slide Badge Overlay -->
            <div id="slideBadge" class="absolute bottom-16 left-4 bg-black/70 backdrop-blur-md text-[11px] px-2.5 py-1 rounded text-zinc-300 border border-white/10 z-20 pointer-events-none">
                Slide No. 1
            </div>
        </div>

        <!-- Bottom Action Toolbar (100% Matching Original Screenshots) -->
        <div class="h-14 bg-[#12131c] border-t border-zinc-800/80 flex items-center justify-between px-3 sm:px-4 z-30 shrink-0">
            <div class="flex items-center space-x-4">
                <button id="playBtn" class="text-white text-sm hover:text-blue-400">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="text-zinc-400 text-sm hover:text-white">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>

            <!-- Right-side Action Buttons matching exact layout -->
            <div class="flex items-center space-x-1 sm:space-x-2">
                <!-- Ask AI Button with Avatar Pill Style -->
                <button onclick="switchTab('ai')" class="bg-[#181a26] hover:bg-[#202336] text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-2 border border-blue-500/40 shadow-[0_0_10px_rgba(59,130,246,0.2)]">
                    <div class="w-5 h-5 rounded-full bg-indigo-500/30 flex items-center justify-center overflow-hidden">
                        <span class="text-[10px]">🤖</span>
                    </div>
                    <span>Ask AI</span>
                </button>

                <!-- Comments Button -->
                <button onclick="switchTab('comments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Comments">
                    <i class="fa-regular fa-comment text-base"></i>
                </button>

                <!-- Download / Attachments Button -->
                <button onclick="switchTab('attachments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Attachments">
                    <i class="fa-solid fa-download text-base"></i>
                </button>

                <!-- Settings / Gear Button -->
                <button onclick="switchTab('timeline')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Timeline">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>

                <!-- Fullscreen / Expand Button -->
                <button class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Fullscreen">
                    <i class="fa-solid fa-expand text-base"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- RIGHT SECTION: Dynamic Drawer Panel -->
    <div id="sidePanel" class="w-full lg:w-[420px] bg-[#0b0c14] border-l border-zinc-800/80 flex flex-col h-1/2 lg:h-full shrink-0">
        
        <!-- Panel Header Navigation Tabs -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800/80 bg-[#0b0c14] shrink-0">
            <div id="panelTabs" class="flex space-x-6 text-xs font-medium text-zinc-400 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('timeline')" id="btn-timeline" class="hover:text-white py-1 whitespace-nowrap">Timeline</button>
                <button onclick="switchTab('attachments')" id="btn-attachments" class="hover:text-white py-1 whitespace-nowrap">Attachments</button>
                <button onclick="switchTab('lectures')" id="btn-lectures" class="hover:text-white py-1 whitespace-nowrap">More Lectures</button>
                <button onclick="switchTab('comments')" id="btn-comments" class="hover:text-white py-1 whitespace-nowrap">Comments</button>
            </div>
            <div class="flex items-center space-x-3 text-zinc-400 pl-2">
                <button class="hover:text-white text-xs"><i class="fa-regular fa-moon"></i></button>
                <button class="hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Dynamic Content Body -->
        <div id="panelBody" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-0">
            <!-- Data will load here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
