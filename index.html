<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyAura Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#07080f] text-zinc-100 font-sans h-screen flex flex-col md:flex-row overflow-hidden select-none">

    <!-- LEFT SECTION: Video Player & Control Bar -->
    <div class="flex-1 flex flex-col h-full bg-black relative">
        
        <!-- Top Title Bar -->
        <div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/80 to-transparent">
            <div class="flex items-center space-x-3">
                <button class="text-white text-xl">←</button>
                <h1 class="text-sm font-semibold text-zinc-100 truncate max-w-xs md:max-w-md">
                    Basics of English Grammar 02 : Basics of English Grammar
                </h1>
            </div>
            <button class="text-white text-lg">⋮</button>
        </div>

        <!-- Video Screen Container -->
        <div class="relative flex-1 flex items-center justify-center bg-black">
            <video id="mainVideo" class="w-full h-full object-contain" poster="https://static.pw.live/5eb393ee95fab7468a79d189/ADMIN/4a144fcc-5b0e-44e0-b587-a840149cab1b.png">
                <source src="https://spark-url3.b-cdn.net/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4/mp4/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4_720p.mp4" type="video/mp4">
            </video>

            <!-- Slide Indicator Overlay -->
            <div class="absolute bottom-16 left-4 bg-black/60 backdrop-blur-md text-[11px] px-2.5 py-1 rounded text-zinc-300">
                Slide No. 1
            </div>
        </div>

        <!-- Custom Player Control Footer -->
        <div class="h-14 bg-[#12131c] border-t border-zinc-800/60 flex items-center justify-between px-4 z-20">
            <div class="flex items-center space-x-4">
                <button id="playBtn" class="text-white text-lg">▶</button>
                <button class="text-zinc-400 text-lg">🔊</button>
            </div>

            <!-- Action Buttons (Exact Screenshot Copy) -->
            <div class="flex items-center space-x-2">
                <!-- Ask AI Button with Glow -->
                <button onclick="switchTab('ai')" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-[0_0_12px_rgba(59,130,246,0.5)]">
                    <span class="text-sm">🤖</span> Ask AI
                </button>

                <!-- Comments Icon -->
                <button onclick="switchTab('comments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50">
                    💬
                </button>

                <!-- Attachments/Notes Icon -->
                <button onclick="switchTab('attachments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50">
                    📥
                </button>

                <!-- Settings Icon -->
                <button onclick="switchTab('settings')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50">
                    ⚙️
                </button>
            </div>
        </div>
    </div>

    <!-- RIGHT SECTION: Dynamic Side Panel -->
    <div id="sidePanel" class="w-full md:w-[380px] lg:w-[420px] bg-[#0b0c14] border-l border-zinc-800/80 flex flex-col h-1/2 md:h-full">
        
        <!-- Panel Header Navigation -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800/80">
            <div id="panelTabs" class="flex space-x-4 text-xs font-medium text-zinc-400">
                <button onclick="switchTab('timeline')" id="tab-timeline" class="hover:text-white py-1">Timeline</button>
                <button onclick="switchTab('attachments')" id="tab-attachments" class="hover:text-white py-1">Attachments</button>
                <button onclick="switchTab('lectures')" id="tab-lectures" class="hover:text-white py-1">More Lectures</button>
            </div>
            <div class="flex items-center space-x-2 text-zinc-400">
                <button class="hover:text-white">🌙</button>
                <button class="hover:text-white text-lg">✕</button>
            </div>
        </div>

        <!-- Panel Body Content -->
        <div id="panelBody" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Dynamic Data Rendered via Script -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
