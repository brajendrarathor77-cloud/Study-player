<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyAura Replica Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#07080f] text-zinc-100 font-sans h-full flex flex-col md:flex-row overflow-hidden select-none">

    <!-- LEFT SECTION: Video Player Area -->
    <div class="flex-1 flex flex-col h-full bg-black relative min-h-0">
        
        <!-- Top Overlay Navigation Bar -->
        <div class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-black/90 via-black/40 to-transparent">
            <div class="flex items-center space-x-3 min-w-0">
                <button class="text-white text-lg hover:opacity-80">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h1 id="lectureTitle" class="text-xs sm:text-sm font-semibold text-zinc-100 truncate">
                    Basics of English Grammar 02 : Basics of English Grammar
                </h1>
            </div>
            <button class="text-white text-base hover:opacity-80">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
            </button>
        </div>

        <!-- Video Player Display Container -->
        <div class="relative flex-1 flex items-center justify-center bg-black overflow-hidden min-h-0">
            <video id="mainVideo" class="w-full h-full object-contain" controls poster="https://static.pw.live/5eb393ee95fab7468a79d189/ADMIN/4a144fcc-5b0e-44e0-b587-a840149cab1b.png">
                <source src="https://spark-url3.b-cdn.net/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4/mp4/2230eb0c-8059-4c6a-ad7b-dbb958ee00f4_720p.mp4" type="video/mp4">
            </video>

            <!-- Slide Badge Overlay -->
            <div id="slideBadge" class="absolute bottom-4 left-4 bg-black/70 backdrop-blur-md text-[11px] px-2.5 py-1 rounded text-zinc-300 border border-white/10 z-20 pointer-events-none">
                Slide No. 1
            </div>
        </div>

        <!-- Custom Player Control Footer Bar -->
        <div class="h-14 bg-[#12131c] border-t border-zinc-800/80 flex items-center justify-between px-3 sm:px-4 z-30 shrink-0">
            <div class="flex items-center space-x-3">
                <button id="playBtn" class="text-white text-sm hover:text-blue-400">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="text-zinc-400 text-sm hover:text-white">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </button>
            </div>

            <!-- Replica Action Icons & Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <!-- Ask AI Glow Button -->
                <button onclick="switchTab('ai')" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-[11px] font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-[0_0_12px_rgba(59,130,246,0.5)] border border-blue-400/30">
                    <span class="w-2 h-2 rounded-full bg-cyan-300 animate-pulse"></span>
                    <span>Ask AI</span>
                </button>

                <!-- Comments Button -->
                <button onclick="switchTab('comments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Comments">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>

                <!-- Attachments Button -->
                <button onclick="switchTab('attachments')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Attachments">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>

                <!-- Timeline / Settings Button -->
                <button onclick="switchTab('timeline')" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800/50" title="Timeline">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- RIGHT SECTION: Interactive Drawer Panel -->
    <div id="sidePanel" class="w-full md:w-[380px] lg:w-[420px] bg-[#0b0c14] border-l border-zinc-800/80 flex flex-col h-1/2 md:h-full shrink-0">
        
        <!-- Panel Header Navigation -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800/80 bg-[#0b0c14] shrink-0">
            <div id="panelTabs" class="flex space-x-4 text-xs font-medium text-zinc-400 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('timeline')" id="btn-timeline" class="hover:text-white py-1 whitespace-nowrap">Timeline</button>
                <button onclick="switchTab('attachments')" id="btn-attachments" class="hover:text-white py-1 whitespace-nowrap">Attachments</button>
                <button onclick="switchTab('lectures')" id="btn-lectures" class="hover:text-white py-1 whitespace-nowrap">More Lectures</button>
                <button onclick="switchTab('comments')" id="btn-comments" class="hover:text-white py-1 whitespace-nowrap">Comments</button>
            </div>
            <div class="flex items-center space-x-3 text-zinc-400 pl-2">
                <button class="hover:text-white text-xs">🌙</button>
                <button class="hover:text-white text-sm">✕</button>
            </div>
        </div>

        <!-- Dynamic Content Body -->
        <div id="panelBody" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-0">
            <!-- Rendered API Output -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
